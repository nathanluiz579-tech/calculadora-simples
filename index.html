<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Simples</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculadora">
    <h1>Calculadora Simples</h1>
    <p class="subtitulo">Escolha a operação e calcule</p>

    <label for="numero1">Primeiro número</label>
    <input id="numero1" type="number" step="any" placeholder="Digite um número">

    <label for="operacao">Operação</label>
    <select id="operacao">
      <option value="somar">Soma (+)</option>
      <option value="subtrair">Subtração (−)</option>
      <option value="multiplicar">Multiplicação (×)</option>
      <option value="dividir">Divisão (÷)</option>
    </select>

    <label for="numero2">Segundo número</label>
    <input id="numero2" type="number" step="any" placeholder="Digite outro número">

    <button id="calcular">Calcular</button>
    <section class="resultado" aria-live="polite">
      <span>Resultado</span>
      <strong id="resultado">—</strong>
    </section>
    <button id="limpar" class="limpar">Limpar</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
